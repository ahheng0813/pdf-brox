<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="An application to modify pdf">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PDF BroX">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Material Icons Font -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Icons+Outlined" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Icons+Round" rel="stylesheet">

  <title>PDF BroX</title>
  <link rel="manifest" href="manifest.json">

  <!-- The splash screen's red while the app loads (splashRed in
       lib/View/splash_screen.dart), so it opens on one colour -->
  <style>
    html.loading, html.loading body { background-color: #CC0000; }
  </style>
</head>
<body>
  <script>
    document.documentElement.classList.add('loading');
    // Once the app draws, its own splash covers the page, which goes back
    // to plain
    window.addEventListener('flutter-first-frame', function () {
      document.documentElement.classList.remove('loading');
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
